# OpenDream on-prem reference stack (illustrative; pin versions in your Harbor)
repositories:
  - name: bitnami
    url: https://charts.bitnami.com/bitnami
  - name: nats
    url: https://nats-io.github.io/k8s/helm/charts
  - name: prometheus-community
    url: https://prometheus-community.github.io/helm-charts
  - name: grafana
    url: https://grafana.github.io/helm-charts
  - name: temporal
    url: https://go.temporal.io/helm-charts

releases:
  - name: postgresql-ha
    namespace: opendream-data
    chart: bitnami/postgresql-ha
    values:
      - postgresql:
          replicaCount: 2
        persistence:
          size: 100Gi
  - name: redis
    namespace: opendream-data
    chart: bitnami/redis
    values:
      - architecture: replication
        replica:
          replicaCount: 3
  - name: nats
    namespace: opendream-data
    chart: nats/nats
    values:
      - config:
          jetstream:
            enabled: true
        cluster:
          enabled: true
          replicas: 3
  - name: minio
    namespace: opendream-data
    chart: bitnami/minio
    values:
      - mode: distributed
        statefulset:
          replicaCount: 4
  - name: keycloak
    namespace: opendream-identity
    chart: bitnami/keycloak
    values:
      - replicas: 2
        postgresql:
          enabled: false
        externalDatabase:
          host: postgresql-ha-pgpool.opendream-data.svc
  - name: kube-prometheus-stack
    namespace: opendream-observability
    chart: prometheus-community/kube-prometheus-stack
  - name: loki
    namespace: opendream-observability
    chart: grafana/loki
  - name: tempo
    namespace: opendream-observability
    chart: grafana/tempo
  - name: opendream-cloud
    namespace: opendream-control
    chart: ../helm/opendream-cloud
    values:
      - ../helm/opendream-cloud/values-ha.yaml
