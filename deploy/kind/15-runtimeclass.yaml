# 强隔离 RuntimeClass（ADR-007：契约名固定 sandbox-runtime，handler 由集群能力决定）
#
# kind 本机通常无 runsc；此处仅为交付物与校验样例。生产：
#  - gVisor 节点池：安装 runsc，handler=runsc
#  - ACK 安全沙箱（Kata）：handler=runv / kata-qemu
apiVersion: node.k8s.io/v1
kind: RuntimeClass
metadata:
  name: sandbox-runtime
  labels: { app.kubernetes.io/name: sandbox-runtime }
handler: runsc
scheduling:
  nodeSelector: { dedicated: sandbox }
  tolerations:
    - { key: dedicated, operator: Equal, value: sandbox, effect: NoSchedule }
overhead:
  podFixed: { cpu: "50m", memory: "128Mi" }
