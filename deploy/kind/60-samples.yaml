# 示例工作区 CR + 应用 1C2G 模板（kind 冒烟用）
apiVersion: v1
kind: Secret
metadata: { name: ws-demo-auth, namespace: ws-org-demo }
type: Opaque
stringData:
  OPENCODE_SERVER_PASSWORD: dev-only-workspace-password-change-me
---
apiVersion: workspace.opencode.cloud/v1alpha1
kind: OpencodeWorkspace
metadata:
  name: ws-demo
  namespace: ws-org-demo
  labels: { opencode.cloud/org-id: org-demo, opencode.cloud/owner-user-id: usr-demo }
spec:
  owner: { userId: usr-demo, orgId: org-demo }
  size: "4C8G"
  image:
    repository: opendream-cloud/workspace-runtime
    tag: "2.2.5-20261104"
    digest: "sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
  persistence:
    size: "20Gi"
    storageClass: opencode-essd
    reclaimPolicy: retain
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: app-demo
  namespace: opencode-apps
  labels: { app.kubernetes.io/name: app-demo }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: app-demo } }
  template:
    metadata: { labels: { app.kubernetes.io/name: app-demo } }
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: app
          image: opendream-cloud/app-demo:0.1.0
          ports: [{ name: http, containerPort: 3000 }]
          resources:
            # 1C2G：requests=limits（C3）
            requests: { cpu: "1", memory: "2Gi" }
            limits: { cpu: "1", memory: "2Gi" }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          volumeMounts: [{ name: tmp, mountPath: /tmp }]
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: v1
kind: Service
metadata: { name: app-demo, namespace: opencode-apps }
spec:
  selector: { app.kubernetes.io/name: app-demo }
  ports: [{ name: http, port: 80, targetPort: 3000 }]
