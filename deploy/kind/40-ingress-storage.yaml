# 入口 + 存储类（kind：local-path；生产为 alicloud-disk-essd + Retain）
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: opencode-essd
  labels: { app.kubernetes.io/name: opencode-essd }
provisioner: rancher.io/local-path
reclaimPolicy: Retain
volumeBindingMode: WaitForFirstConsumer
allowVolumeExpansion: true
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: console
  namespace: opencode-control
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
spec:
  ingressClassName: nginx
  rules:
    - host: console.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: control-plane, port: { number: 4000 } } } }
---
# 工作区入口示例（生产由 operator 按 CR 每工作区创建子域名 Ingress）
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: workspace-demo
  namespace: ws-org-demo
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffering: "off"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "3600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
spec:
  ingressClassName: nginx
  rules:
    - host: ws-demo.ws.localhost
      http:
        paths:
          - { path: /, pathType: Prefix, backend: { service: { name: ws-demo, port: { number: 4096 } } } }
