# workspace-operator：RBAC + Deployment（kind）
apiVersion: v1
kind: ServiceAccount
metadata: { name: workspace-operator, namespace: opencode-system }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: workspace-operator }
rules:
  - apiGroups: ["workspace.opencode.cloud"]
    resources: ["opencodeworkspaces"]
    verbs: ["get", "list", "watch", "update", "patch"]
  - apiGroups: ["workspace.opencode.cloud"]
    resources: ["opencodeworkspaces/status"]
    verbs: ["get", "update", "patch"]
  - apiGroups: ["workspace.opencode.cloud"]
    resources: ["opencodeworkspaces/finalizers"]
    verbs: ["update"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services", "secrets", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: workspace-operator }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: workspace-operator }
subjects: [{ kind: ServiceAccount, name: workspace-operator, namespace: opencode-system }]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-operator
  namespace: opencode-system
  labels: { app.kubernetes.io/name: workspace-operator, opencode.cloud/enforce-security: "true" }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: workspace-operator } }
  template:
    metadata: { labels: { app.kubernetes.io/name: workspace-operator } }
    spec:
      serviceAccountName: workspace-operator
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: operator
          image: opendream-cloud/workspace-operator:0.1.0
          args: ["--leader-elect=true", "--metrics-bind-address=:8080", "--health-probe-bind-address=:8081"]
          env:
            - { name: WORKSPACE_DOMAIN, value: example.com }
          ports:
            - { name: metrics, containerPort: 8080 }
            - { name: health, containerPort: 8081 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: ["ALL"] }
          livenessProbe: { httpGet: { path: /healthz, port: health }, periodSeconds: 20 }
          readinessProbe: { httpGet: { path: /readyz, port: health }, periodSeconds: 10 }
          volumeMounts:
            - { name: tmp, mountPath: /tmp }
      volumes:
        - { name: tmp, emptyDir: { sizeLimit: 256Mi } }
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata: { name: workspace-operator, namespace: opencode-system }
spec:
  minAvailable: 1
  selector: { matchLabels: { app.kubernetes.io/name: workspace-operator } }
