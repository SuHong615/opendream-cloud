# 网络隔离基线（默认拒绝 + 白名单）+ 配额
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-all, namespace: ws-org-demo }
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: workspace-allow, namespace: ws-org-demo }
spec:
  podSelector: { matchLabels: { app.kubernetes.io/name: opencode-workspace } }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opencode-gateway } }
          podSelector: { matchLabels: { app.kubernetes.io/name: workspace-gateway } }
      ports: [{ protocol: TCP, port: 4096 }]
  egress:
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } } }]
      ports: [{ protocol: UDP, port: 53 }, { protocol: TCP, port: 53 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opencode-control } } }]
      ports: [{ protocol: TCP, port: 4000 }]
    - to: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opencode-gateway } } }]
      ports: [{ protocol: TCP, port: 4000 }, { protocol: TCP, port: 3128 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: control-plane-deny, namespace: opencode-control }
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from: [{ namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opencode-gateway } } }]
      ports: [{ protocol: TCP, port: 4000 }]
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: workspace-quota, namespace: ws-org-demo }
spec:
  hard:
    requests.cpu: "12"
    requests.memory: "24Gi"
    limits.cpu: "12"
    limits.memory: "24Gi"
    persistentvolumeclaims: "4"
    requests.storage: "80Gi"
    count/opencodeworkspaces.workspace.opencode.cloud: "4"
---
apiVersion: v1
kind: LimitRange
metadata: { name: workspace-limits, namespace: ws-org-demo }
spec:
  limits:
    - type: Container
      default: { cpu: "4", memory: "8Gi" }
      defaultRequest: { cpu: "4", memory: "8Gi" }
      max: { cpu: "4", memory: "8Gi" }
---
apiVersion: v1
kind: ResourceQuota
metadata: { name: apps-quota, namespace: opencode-apps }
spec:
  hard:
    requests.cpu: "8"
    requests.memory: "16Gi"
    limits.cpu: "8"
    limits.memory: "16Gi"
    count/deployments.apps: "8"
---
apiVersion: v1
kind: LimitRange
metadata: { name: app-limits, namespace: opencode-apps }
spec:
  limits:
    - type: Container
      default: { cpu: "1", memory: "2Gi" }
      defaultRequest: { cpu: "1", memory: "2Gi" }
      max: { cpu: "1", memory: "2Gi" }
