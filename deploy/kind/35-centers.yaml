# G5 四中心服务（MVP 骨架，无状态；生产按需拆 Deployment/扩副本）
apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-center
  namespace: platform-system
  labels: { app.kubernetes.io/name: skill-center, app.kubernetes.io/part-of: opendream-cloud }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: skill-center } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: skill-center, app.kubernetes.io/part-of: opendream-cloud }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 10001, fsGroup: 10001, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: skill-center
          image: registry.opendream-cloud.local/opendream-cloud/skill-center:0.1.0-g5
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 4101, name: http }]
          env:
            - { name: NODE_ENV, value: production }
            - { name: PORT, value: "4101" }
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 3, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 10 }
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: ["ALL"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: skill-center
  namespace: platform-system
  labels: { app.kubernetes.io/name: skill-center, app.kubernetes.io/part-of: opendream-cloud }
spec:
  selector: { app.kubernetes.io/name: skill-center }
  ports: [{ name: http, port: 4101, targetPort: http }]
---
