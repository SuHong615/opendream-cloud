{{- if .Values.operator.crd.create }}
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: opencodeworkspaces.workspace.opencode.cloud
  labels:
    {{- include "opendream-cloud.labels" . | nindent 4 }}
spec:
  group: workspace.opencode.cloud
  scope: Namespaced
  names:
    kind: OpencodeWorkspace
    listKind: OpencodeWorkspaceList
    plural: opencodeworkspaces
    singular: opencodeworkspace
    shortNames: [ow]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources: { status: {} }
      additionalPrinterColumns:
        - { name: Phase, type: string, jsonPath: .status.phase }
        - { name: URL, type: string, jsonPath: .status.url }
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            spec:
              type: object
              required: [owner, size, image]
              properties:
                owner:
                  type: object
                  required: [userId]
                  properties:
                    userId: { type: string }
                    orgId: { type: string }
                size: { type: string, enum: ["4C8G"] }
                image:
                  type: object
                  required: [repository]
                  properties:
                    repository: { type: string }
                    tag: { type: string }
                    digest: { type: string }
                persistence:
                  type: object
                  properties:
                    size: { type: string }
                    storageClass: { type: string }
                    reclaimPolicy: { type: string, enum: [retain, snapshot-then-delete, delete] }
            status:
              type: object
              properties:
                phase: { type: string }
                url: { type: string }
{{- end }}
