# HA overlay for deploy/helm/opendream-cloud
# 需要 chart 支持 replicas/PDB；未支持时作为目标值参考。
controlPlane:
  replicaCount: 3
operator:
  replicaCount: 2
  leaderElection: true
centers:
  replicaCount: 3
gateway:
  replicaCount: 3

podDisruptionBudget:
  enabled: true
  minAvailable: 2

topologySpreadConstraints:
  - maxSkew: 1
    topologyKey: topology.kubernetes.io/zone
    whenUnsatisfiable: ScheduleAnyway
    labelSelector:
      matchLabels:
        app.kubernetes.io/part-of: opendream

resources:
  controlPlane:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
  gateway:
    requests: { cpu: 500m, memory: 512Mi }
    limits: { cpu: "2", memory: 2Gi }
