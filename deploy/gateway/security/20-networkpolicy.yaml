# 网关命名空间网络隔离：默认拒绝 + 仅放行必要流量
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: higress-system
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: higress-gateway-allow
  namespace: higress-system
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: higress-gateway
  policyTypes: [Ingress, Egress]
  ingress:
    # 来自 SLB（节点网段/ENI）；生产按实际节点 CIDR 收敛
    - from:
        - ipBlock: { cidr: 10.0.0.0/16 }
      ports:
        - { protocol: TCP, port: 80 }
        - { protocol: TCP, port: 443 }
    # 内网网关/监控
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform-system } }
      ports:
        - { protocol: TCP, port: 8080 }
        - { protocol: TCP, port: 15020 }
  egress:
    # DNS
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # 后端数据面（按命名空间收敛）
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opencode-control } }
      ports:
        - { protocol: TCP, port: 4000 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opencode-gateway } }
      ports:
        - { protocol: TCP, port: 4000 }
        - { protocol: TCP, port: 8080 }
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: opencode-apps } }
      ports:
        - { protocol: TCP, port: 3000 }
    # 工作区（子域名路由）
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ws-org-demo } }
      ports:
        - { protocol: TCP, port: 4096 }
---
# 允许控制面/网关命名空间被 Gateway 引用（Gateway API ReferenceGrant）
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-higress
  namespace: opencode-control
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: higress-system
  to:
    - group: ""
      kind: Service
---
apiVersion: gateway.networking.k8s.io/v1beta1
kind: ReferenceGrant
metadata:
  name: allow-higress
  namespace: opencode-gateway
spec:
  from:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      namespace: higress-system
  to:
    - group: ""
      kind: Service
