---
# 默认拒绝：未匹配任何域名的请求返回 404（不回落控制台首页）
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: default-deny
  namespace: higress-system
  labels: { opencode.cloud/gateway-access: "true" }
spec:
  parentRefs: [{ name: higress-public, namespace: higress-system, sectionName: https }]
  rules:
    - matches: [{ path: { type: PathPrefix, value: / } }]
      backendRefs: [{ name: blackhole, port: 80 }]
