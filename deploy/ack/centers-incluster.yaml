apiVersion: apps/v1
kind: Deployment
metadata:
  name: skill-center
  namespace: opencode-system
  labels: { app.kubernetes.io/name: skill-center, app.kubernetes.io/part-of: opendream-cloud }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/name: skill-center } }
  template:
    metadata:
      labels: { app.kubernetes.io/name: skill-center, app.kubernetes.io/part-of: opendream-cloud }
    spec:
      containers:
        - name: skill-center
          image: docker.m.daocloud.io/oven/bun:1.4.4
          command: ['/bin/sh', '-c']
          args:
            - >-
              set -e; mkdir -p /work; tar xzf /src/src.tgz -C /work;
              cd /work/services/skill-center;
              bun install --production --registry https://registry.npmmirror.com;
              exec bun src/server.ts
          env:
            - { name: NODE_ENV, value: development }
            - { name: PORT, value: '4101' }
          ports: [{ containerPort: 4101, name: http }]
          readinessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 10, periodSeconds: 5 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, initialDelaySeconds: 40, periodSeconds: 20 }
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 300m, memory: 384Mi }
          volumeMounts: [{ name: src, mountPath: /src, readOnly: true }]
      volumes: [{ name: src, configMap: { name: skill-center-src } }]
---
apiVersion: v1
kind: Service
metadata:
  name: skill-center
  namespace: opencode-system
  labels: { app.kubernetes.io/name: skill-center }
spec:
  selector: { app.kubernetes.io/name: skill-center }
  ports: [{ name: http, port: 4101, targetPort: http }]
---
