# workspace-operator (in-cluster demo: source ConfigMap + build inside golang image)
# Production: prebuilt image + distroless + read-only root + minimal RBAC.
# 鐢熶骇搴旀敼涓洪鏋勫缓闀滃儚 + distroless + 鍙鏍?+ RBAC 鏈€灏忓寲锛夈€?
apiVersion: v1
kind: ServiceAccount
metadata:
  name: workspace-operator
  namespace: opencode-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: workspace-operator
rules:
  - apiGroups: ["workspace.opencode.cloud"]
    resources: ["opencodeworkspaces", "opencodeworkspaces/status", "opencodeworkspaces/finalizers"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "services", "events"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: workspace-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: workspace-operator
subjects:
  - kind: ServiceAccount
    name: workspace-operator
    namespace: opencode-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: workspace-operator
  namespace: opencode-system
  labels:
    app.kubernetes.io/name: workspace-operator
    app.kubernetes.io/part-of: opendream-cloud
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: workspace-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: workspace-operator
        app.kubernetes.io/part-of: opendream-cloud
    spec:
      serviceAccountName: workspace-operator
      containers:
        - name: operator
          image: docker.m.daocloud.io/library/golang:1.24
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /work
              tar xzf /src/src.tgz -C /work
              cd /work
              export GOPROXY=https://goproxy.cn,direct
              export GOSUMDB=off
              export CGO_ENABLED=0
              go build -o /tmp/workspace-operator .
              exec /tmp/workspace-operator --leader-elect=false \
                --metrics-bind-address=:8080 --health-probe-bind-address=:8081
          env:
            - { name: WORKSPACE_DOMAIN, value: example.com }
            - { name: GOMODCACHE, value: /go/pkg/mod }
            - { name: GOCACHE, value: /go/cache }
          ports:
            - { containerPort: 8080, name: metrics }
            - { containerPort: 8081, name: health }
          readinessProbe:
            httpGet: { path: /readyz, port: health }
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet: { path: /healthz, port: health }
            initialDelaySeconds: 300
            periodSeconds: 30
            failureThreshold: 20
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
          volumeMounts:
            - { name: src, mountPath: /src, readOnly: true }
            - { name: gocache, mountPath: /go }
      volumes:
        - name: src
          configMap:
            name: operator-src
        - name: gocache
          emptyDir:
            sizeLimit: 2Gi

