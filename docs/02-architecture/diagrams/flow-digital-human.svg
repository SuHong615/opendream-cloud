<svg xmlns="http://www.w3.org/2000/svg" width="1790" height="712" viewBox="0 0 1790 712"><rect width="100%" height="100%" fill="#ffffff"/><text x="50" y="32" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">数据流：数字人实时会话（首句优先）</text><text x="50" y="54" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">RTC token → SFU → 流式 ASR → Agent(+MCP) → 流式 TTS → GPU 口型 → 下行</text><line x1="125" y1="120" x2="125" y2="682" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="50" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="125" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">用户</text><line x1="345" y1="120" x2="345" y2="682" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="270" y="80" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="345" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#164e63">DH Control</text><line x1="565" y1="120" x2="565" y2="682" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="490" y="80" width="150" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="565" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14532d">WebRTC SFU</text><line x1="785" y1="120" x2="785" y2="682" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="710" y="80" width="150" height="40" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="785" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7c2d12">ASR</text><line x1="1005" y1="120" x2="1005" y2="682" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="930" y="80" width="150" height="40" rx="8" fill="#fdf2f8" stroke="#db2777"/><text x="1005" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#831843">Agent/Model</text><line x1="1225" y1="120" x2="1225" y2="682" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1150" y="80" width="150" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="1225" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#713f12">MCP GW</text><line x1="1445" y1="120" x2="1445" y2="682" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1370" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="1445" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">TTS</text><line x1="1665" y1="120" x2="1665" y2="682" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1590" y="80" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="1665" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#164e63">GPU 渲染</text><line x1="125" y1="144" x2="337" y2="144" stroke="#334155" stroke-width="1.4"/><path d="M345,144 L335,140 L335,148 Z" fill="#334155"/><text x="235" y="137" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">1. 创建会话（persona/voice/mode）</text><path d="M345,190 h40 v22 h-40" fill="none" stroke="#334155" stroke-width="1.4"/><path d="M385,212 l-8,-4 v8 Z" fill="#334155"/><text x="391" y="194" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">授权校验 + 配额 + 内容策略</text><line x1="345" y1="236" x2="557" y2="236" stroke="#334155" stroke-width="1.4"/><path d="M565,236 L555,232 L555,240 Z" fill="#334155"/><text x="455" y="229" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">3. room + RTC token（≤5min）</text><line x1="125" y1="282" x2="557" y2="282" stroke="#334155" stroke-width="1.4"/><path d="M565,282 L555,278 L555,286 Z" fill="#334155"/><text x="345" y="275" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">4. 加入 room（音频上行）</text><line x1="565" y1="328" x2="777" y2="328" stroke="#334155" stroke-width="1.4"/><path d="M785,328 L775,324 L775,332 Z" fill="#334155"/><text x="675" y="321" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">5. 音频分片 200-300ms</text><line x1="785" y1="374" x2="997" y2="374" stroke="#334155" stroke-width="1.4"/><path d="M1005,374 L995,370 L995,378 Z" fill="#334155"/><text x="895" y="367" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">6. 流式转写</text><line x1="1005" y1="420" x2="1217" y2="420" stroke="#334155" stroke-width="1.4"/><path d="M1225,420 L1215,416 L1215,424 Z" fill="#334155"/><text x="1115" y="413" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">7. tools/call（可选）</text><line x1="1005" y1="466" x2="1437" y2="466" stroke="#334155" stroke-width="1.4"/><path d="M1445,466 L1435,462 L1435,470 Z" fill="#334155"/><text x="1225" y="459" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">8. 首句流式输出（不等全文）</text><line x1="1445" y1="512" x2="1657" y2="512" stroke="#334155" stroke-width="1.4"/><path d="M1665,512 L1655,508 L1655,516 Z" fill="#334155"/><text x="1555" y="505" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">9. 音频 chunk</text><line x1="1665" y1="558" x2="573" y2="558" stroke="#334155" stroke-width="1.4"/><path d="M565,558 L575,554 L575,562 Z" fill="#334155"/><text x="1115" y="551" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">10. 视频帧 + 水印（720p）</text><line x1="565" y1="604" x2="133" y2="604" stroke="#334155" stroke-width="1.4"/><path d="M125,604 L135,600 L135,608 Z" fill="#334155"/><text x="345" y="597" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">11. 下行音视频（P50 ≤800ms）</text><rect x="40" y="636" width="1710" height="28" rx="6" fill="#fef9c3" stroke="#eab308"/><text x="895" y="655" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#713f12">降级：3D→2D 静态贴图→纯音频→文本+HLS；默认水印 + 内容审核 + 会话审计</text></svg>