<svg xmlns="http://www.w3.org/2000/svg" width="2010" height="666" viewBox="0 0 2010 666"><rect width="100%" height="100%" fill="#ffffff"/><text x="50" y="32" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">数据流：应用发布 + 分享访问</text><text x="50" y="54" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">工作区 → BuildKit → ACR → 1C2G Runtime → ACL → 使用者 SSO/ticket</text><line x1="125" y1="120" x2="125" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="50" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="125" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">开发者</text><line x1="345" y1="120" x2="345" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="270" y="80" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="345" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#164e63">Console</text><line x1="565" y1="120" x2="565" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="490" y="80" width="150" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="565" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14532d">App Center</text><line x1="785" y1="120" x2="785" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="710" y="80" width="150" height="40" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="785" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7c2d12">Workspace</text><line x1="1005" y1="120" x2="1005" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="930" y="80" width="150" height="40" rx="8" fill="#fdf2f8" stroke="#db2777"/><text x="1005" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#831843">BuildKit</text><line x1="1225" y1="120" x2="1225" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1150" y="80" width="150" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="1225" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#713f12">ACR</text><line x1="1445" y1="120" x2="1445" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1370" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="1445" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">App Runtime</text><line x1="1665" y1="120" x2="1665" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1590" y="80" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="1665" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#164e63">app-gateway</text><line x1="1885" y1="120" x2="1885" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1810" y="80" width="150" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="1885" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14532d">使用者</text><line x1="125" y1="144" x2="337" y2="144" stroke="#334155" stroke-width="1.4"/><path d="M345,144 L335,140 L335,148 Z" fill="#334155"/><text x="235" y="137" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">1. 发布应用（入口/模板/上下文）</text><line x1="345" y1="190" x2="557" y2="190" stroke="#334155" stroke-width="1.4"/><path d="M565,190 L555,186 L555,194 Z" fill="#334155"/><text x="455" y="183" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">2. POST /apps + preflight</text><line x1="565" y1="236" x2="777" y2="236" stroke="#334155" stroke-width="1.4"/><path d="M785,236 L775,232 L775,240 Z" fill="#334155"/><text x="675" y="229" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">3. 导出构建上下文</text><line x1="565" y1="282" x2="997" y2="282" stroke="#334155" stroke-width="1.4"/><path d="M1005,282 L995,278 L995,286 Z" fill="#334155"/><text x="785" y="275" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">4. 构建 Job（rootless, 缓存）</text><line x1="1005" y1="328" x2="1217" y2="328" stroke="#334155" stroke-width="1.4"/><path d="M1225,328 L1215,324 L1215,332 Z" fill="#334155"/><text x="1115" y="321" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">5. push rev-uuid + digest + SBOM</text><line x1="565" y1="374" x2="1437" y2="374" stroke="#334155" stroke-width="1.4"/><path d="M1445,374 L1435,370 L1435,378 Z" fill="#334155"/><text x="1005" y="367" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">6. Deployment 1C2G + Ingress</text><line x1="125" y1="420" x2="557" y2="420" stroke="#334155" stroke-width="1.4"/><path d="M565,420 L555,416 L555,424 Z" fill="#334155"/><text x="345" y="413" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">7. 分享 ACL（scope/role/subject）</text><line x1="1885" y1="466" x2="1673" y2="466" stroke="#334155" stroke-width="1.4"/><path d="M1665,466 L1675,462 L1675,470 Z" fill="#334155"/><text x="1775" y="459" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">8. 打开分享链接（sst_ token）</text><line x1="1665" y1="512" x2="353" y2="512" stroke="#334155" stroke-width="1.4"/><path d="M345,512 L355,508 L355,516 Z" fill="#334155"/><text x="1005" y="505" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">9. 无 SSO → 302 登录（return_to）</text><line x1="1665" y1="558" x2="1453" y2="558" stroke="#334155" stroke-width="1.4"/><path d="M1445,558 L1455,554 L1455,562 Z" fill="#334155"/><text x="1555" y="551" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">10. 验 token+ACL → 反代</text><rect x="40" y="590" width="1930" height="28" rx="6" fill="#fef9c3" stroke="#eab308"/><text x="1005" y="609" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#713f12">token 过期/撤销 → 410；签名不符 → 403；ACL 变更 ≤5s（Redis 主动失效）</text></svg>