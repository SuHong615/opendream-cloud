roke="#db2777"/><text x="1005" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#831843">Workspace</text><line x1="1225" y1="120" x2="1225" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1150" y="80" width="150" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="1225" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#713f12">MCP GW</text><line x1="1445" y1="120" x2="1445" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1370" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="1445" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">人工任务</text><line x1="1665" y1="120" x2="1665" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1590" y="80" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="1665" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#164e63">App Center</text><line x1="125" y1="144" x2="337" y2="144" stroke="#334155" stroke-width="1.4"/><path d="M345,144 L335,140 L335,148 Z" fill="#334155"/><text x="235" y="137" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">1. 事件（event_id/type/thread_id）</text><line x1="345" y1="190" x2="557" y2="190" stroke="#334155" stroke-width="1.4"/><path d="M565,190 L555,186 L555,194 Z" fill="#334155"/><text x="455" y="183" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">2. 消费（thread 保序 + 幂等）</text><line x1="565" y1="236" x2="777" y2="236" stroke="#334155" stroke-width="1.4"/><path d="M785,236 L775,232 L775,240 Z" fill="#334155"/><text x="675" y="229" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">3. start（DSL 版本不可变）</text><line x1="785" y1="282" x2="997" y2="282" stroke="#334155" stroke-width="1.4"/><path d="M1005,282 L995,278 L995,286 Z" fill="#334155"/><text x="895" y="275" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">4. agent 节点（工作区 API）</text><line x1="1005" y1="328" x2="793" y2="328" stroke="#334155" stroke-width="1.4"/><path d="M785,328 L795,324 L795,332 Z" fill="#334155"/><text x="895" y="321" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">5. 产物（PR/代码/报告）</text><line x1="785" y1="374" x2="1217" y2="374" stroke="#334155" stroke-width="1.4"/><path d="M1225,374 L1215,370 L1215,378 Z" fill="#334155"/><text x="1005" y="367" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">6. mcp_tool 节点</text><line x1="785" y1="420" x2="1437" y2="420" stroke="#334155" stroke-width="1.4"/><path d="M1445,420 L1435,416 L1435,424 Z" fill="#334155"/><text x="1115" y="413" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">7. human_approval（SLA/升级）</text><line x1="1445" y1="466" x2="793" y2="466" stroke="#334155" stroke-width="1.4"/><path d="M785,466 L795,462 L795,470 Z" fill="#334155"/><text x="1115" y="459" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">8. decision（Signal）</text><line x1="785" y1="512" x2="1657" y2="512" stroke="#334155" stroke-width="1.4"/><path d="M1665,512 L1655,508 L1655,516 Z" fill="#334155"/><text x="1225" y="505" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">9. 发布节点（构建/部署）</text><path d="M785,558 h40 v22 h-40" fill="none" stroke="#334155" stroke-width="1.4"/><path d="M825,580 l-8,-4 v8 Z" fill="#334155"/><text x="831" y="562" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">补偿（逆序 Saga）→ 死信/人工</text><rect x="40" y="590" width="1710" height="28" rx="6" fill="#fef9c3" stroke="#eab308"/><text x="895" y="609" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#713f12">幂等键 {workflow_id}/{run_id}/{activity_id}/{attempt}；取消级联到 opencode/MCP/部署</text></svg>