<svg xmlns="http://www.w3.org/2000/svg" width="1570" height="666" viewBox="0 0 1570 666"><rect width="100%" height="100%" fill="#ffffff"/><text x="50" y="32" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">数据流：MCP 工具调用（工具级 PEP）</text><text x="50" y="54" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">opencode → Higress → mcp-gateway → Registry/Policy → KMS → 企业 MCP → 审计</text><line x1="125" y1="120" x2="125" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="50" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="125" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">opencode WS</text><line x1="345" y1="120" x2="345" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="270" y="80" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="345" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#164e63">Higress</text><line x1="565" y1="120" x2="565" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="490" y="80" width="150" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="565" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14532d">mcp-gateway</text><line x1="785" y1="120" x2="785" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="710" y="80" width="150" height="40" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="785" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7c2d12">Registry/Policy</text><line x1="1005" y1="120" x2="1005" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="930" y="80" width="150" height="40" rx="8" fill="#fdf2f8" stroke="#db2777"/><text x="1005" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#831843">KMS</text><line x1="1225" y1="120" x2="1225" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1150" y="80" width="150" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="1225" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#713f12">企业 MCP</text><line x1="1445" y1="120" x2="1445" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1370" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="1445" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">审计/Trace</text><line x1="125" y1="144" x2="337" y2="144" stroke="#334155" stroke-width="1.4"/><path d="M345,144 L335,140 L335,148 Z" fill="#334155"/><text x="235" y="137" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">1. POST /v1/acme/crm + workspace-ticket</text><line x1="345" y1="190" x2="557" y2="190" stroke="#334155" stroke-width="1.4"/><path d="M565,190 L555,186 L555,194 Z" fill="#334155"/><text x="455" y="183" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">2. mTLS 转发（保留 Host/头）</text><path d="M565,236 h40 v22 h-40" fill="none" stroke="#334155" stroke-width="1.4"/><path d="M605,258 l-8,-4 v8 Z" fill="#334155"/><text x="611" y="240" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#334155">验 ticket（JWKS 本地, aud=mcp:org:acme）</text><line x1="565" y1="282" x2="777" y2="282" stroke="#334155" stroke-width="1.4"/><path d="M785,282 L775,278 L775,286 Z" fill="#334155"/><text x="675" y="275" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">4. 策略查询（租户/角色/工具/版本）</text><line x1="785" y1="328" x2="573" y2="328" stroke="#334155" stroke-width="1.4"/><path d="M565,328 L575,324 L575,332 Z" fill="#334155"/><text x="675" y="321" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">5. allow + tool_snapshot + credential_ref</text><line x1="565" y1="374" x2="997" y2="374" stroke="#334155" stroke-width="1.4"/><path d="M1005,374 L995,370 L995,378 Z" fill="#334155"/><text x="785" y="367" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">6. 解密凭证（仅内存）</text><line x1="565" y1="420" x2="1217" y2="420" stroke="#334155" stroke-width="1.4"/><path d="M1225,420 L1215,416 L1215,424 Z" fill="#334155"/><text x="895" y="413" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">7. initialize / tools/call（注入凭证）</text><line x1="1225" y1="466" x2="573" y2="466" stroke="#334155" stroke-width="1.4"/><path d="M565,466 L575,462 L575,470 Z" fill="#334155"/><text x="895" y="459" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">8. result（流式）</text><line x1="565" y1="512" x2="1437" y2="512" stroke="#334155" stroke-width="1.4"/><path d="M1445,512 L1435,508 L1435,516 Z" fill="#334155"/><text x="1005" y="505" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">9. audit + span（脱敏）</text><line x1="565" y1="558" x2="133" y2="558" stroke="#334155" stroke-width="1.4"/><path d="M125,558 L135,554 L135,562 Z" fill="#334155"/><text x="345" y="551" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">10. result（脱敏/限长/缓存标记）</text><rect x="40" y="590" width="1490" height="28" rx="6" fill="#fef9c3" stroke="#eab308"/><text x="785" y="609" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#713f12">未授权工具：error -32001 + audit denied；tools/list 在网关侧过滤，opencode 不可见</text></svg>