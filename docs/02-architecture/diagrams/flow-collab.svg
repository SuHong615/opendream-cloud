<svg xmlns="http://www.w3.org/2000/svg" width="1790" height="666" viewBox="0 0 1790 666"><rect width="100%" height="100%" fill="#ffffff"/><text x="50" y="32" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="20" font-weight="700" fill="#0f172a">数据流：应用协同编辑（Patch + 乐观锁 + 审批）</text><text x="50" y="54" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="12" fill="#64748b">对话 → Agent 分支 patch → 提案 → 审批 → CI → 预览 → 发布</text><line x1="125" y1="120" x2="125" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="50" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="125" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">编辑者</text><line x1="345" y1="120" x2="345" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="270" y="80" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="345" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#164e63">Console</text><line x1="565" y1="120" x2="565" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="490" y="80" width="150" height="40" rx="8" fill="#f0fdf4" stroke="#16a34a"/><text x="565" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#14532d">Collab Service</text><line x1="785" y1="120" x2="785" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="710" y="80" width="150" height="40" rx="8" fill="#fff7ed" stroke="#ea580c"/><text x="785" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#7c2d12">Agent/Workspace</text><line x1="1005" y1="120" x2="1005" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="930" y="80" width="150" height="40" rx="8" fill="#fdf2f8" stroke="#db2777"/><text x="1005" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#831843">Git</text><line x1="1225" y1="120" x2="1225" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1150" y="80" width="150" height="40" rx="8" fill="#fef9c3" stroke="#ca8a04"/><text x="1225" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#713f12">审批人</text><line x1="1445" y1="120" x2="1445" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1370" y="80" width="150" height="40" rx="8" fill="#eef2ff" stroke="#4f46e5"/><text x="1445" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#1e1b4b">CI/构建</text><line x1="1665" y1="120" x2="1665" y2="636" stroke="#cbd5e1" stroke-dasharray="5,4"/><rect x="1590" y="80" width="150" height="40" rx="8" fill="#ecfeff" stroke="#0891b2"/><text x="1665" y="104" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#164e63">App Runtime</text><line x1="125" y1="144" x2="337" y2="144" stroke="#334155" stroke-width="1.4"/><path d="M345,144 L335,140 L335,148 Z" fill="#334155"/><text x="235" y="137" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">1. 打开协同修改（描述需求）</text><line x1="345" y1="190" x2="557" y2="190" stroke="#334155" stroke-width="1.4"/><path d="M565,190 L555,186 L555,194 Z" fill="#334155"/><text x="455" y="183" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">2. 创建 session（app_id + base_version）</text><line x1="565" y1="236" x2="777" y2="236" stroke="#334155" stroke-width="1.4"/><path d="M785,236 L775,232 L775,240 Z" fill="#334155"/><text x="675" y="229" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">3. 启动 Agent 任务</text><line x1="785" y1="282" x2="997" y2="282" stroke="#334155" stroke-width="1.4"/><path d="M1005,282 L995,278 L995,286 Z" fill="#334155"/><text x="895" y="275" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">4. checkout collab/&lt;session&gt; + commit patch</text><line x1="785" y1="328" x2="573" y2="328" stroke="#334155" stroke-width="1.4"/><path d="M565,328 L575,324 L575,332 Z" fill="#334155"/><text x="675" y="321" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">5. 提案（diff/风险/测试建议）</text><line x1="565" y1="374" x2="1217" y2="374" stroke="#334155" stroke-width="1.4"/><path d="M1225,374 L1215,370 L1215,378 Z" fill="#334155"/><text x="895" y="367" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">6. proposal_created（SSE）</text><line x1="1225" y1="420" x2="573" y2="420" stroke="#334155" stroke-width="1.4"/><path d="M565,420 L575,416 L575,424 Z" fill="#334155"/><text x="895" y="413" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">7. approve（高风险双人）</text><line x1="565" y1="466" x2="997" y2="466" stroke="#334155" stroke-width="1.4"/><path d="M1005,466 L995,462 L995,470 Z" fill="#334155"/><text x="785" y="459" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">8. rebase + merge</text><line x1="565" y1="512" x2="1437" y2="512" stroke="#334155" stroke-width="1.4"/><path d="M1445,512 L1435,508 L1435,516 Z" fill="#334155"/><text x="1005" y="505" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">9. 测试/扫描门禁</text><line x1="1445" y1="558" x2="1657" y2="558" stroke="#334155" stroke-width="1.4"/><path d="M1665,558 L1655,554 L1655,562 Z" fill="#334155"/><text x="1555" y="551" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="10.5" fill="#475569">10. 预览环境 → 发布（可回滚）</text><rect x="40" y="590" width="1710" height="28" rx="6" fill="#fef9c3" stroke="#eab308"/><text x="895" y="609" text-anchor="middle" font-family="Microsoft YaHei, Segoe UI, Arial, sans-serif" font-size="11" fill="#713f12">base_version 落后 → 409 version_conflict；同一 app 仅一个 pending proposal 可合并</text></svg>