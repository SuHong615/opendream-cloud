                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/EvalDataset'
                  next_cursor:
                    type:
                    - string
                    - 'null'
    post:
      tags:
      - evals
      operationId: createEvalDataset
      summary: 创建数据集（multipart JSONL）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - slug
              - name
              - version
              - cases
              properties:
                slug:
                  type: string
                  pattern: ^[a-z0-9][a-z0-9-]{1,62}$
                name:
                  type: string
                version:
                  type: string
                  pattern: ^\d+\.\d+\.\d+$
                schema:
                  type: string
                  description: JSON 字符串，用例字段定义
                cases:
                  type: string
                  format: binary
                  description: JSONL 用例文件
