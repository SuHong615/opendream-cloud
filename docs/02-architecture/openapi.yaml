          type: string
        image_digest:
          type: string
        model_default:
          type:
          - string
          - 'null'
        config_revision:
          type: integer
          format: int64
        last_activity_at:
          type:
          - string
          - 'null'
          format: date-time
        idle_since:
          type:
          - string
          - 'null'
          format: date-time
        destroy_scheduled_at:
          type:
          - string
          - 'null'
          format: date-time
