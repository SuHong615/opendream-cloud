components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: __Host-oc_session
      description: 控制面 auth-edge（唯一 OIDC RP）建立的会话 Cookie（host-only、无 Domain、HttpOnly/Secure/SameSite=Lax）
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: ock
      description: 平台 API Key，形如 `ock_<random>`；仅创建时返回明文
  parameters:
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: workspaceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ProviderId:
      name: providerId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ModelId:
      name: modelId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    SkillId:
      name: skillId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    DatasetId:
      name: datasetId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RunId:
      name: runId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    AppId:
      name: appId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    McpServerId:
      name: serverId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    ExportId:
      name: exportId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      description: 不透明游标（上一页的 `next_cursor`）
      schema:
        type: string
        maxLength: 512
    Limit:
      name: limit
      in: query
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: ETag 条件请求（用于轮询兜底）
      schema:
        type: string
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      description: 幂等键（建议 UUIDv7）；同一 key 24h 内重放返回首次结果
      schema:
        type: string
        minLength: 8
        maxLength: 128
  headers:
    RequestId:
      description: 请求追踪 ID（与 error.request_id 同值）
      schema:
        type: string
    ETag:
      description: 资源版本弱 ETag
      schema:
        type: string
    RetryAfter:
      description: 建议重试秒数
      schema:
        type: integer
  responses:
    BadRequest:
      description: 参数校验失败（`code=validation_failed`）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Unauthorized:
      description: 未认证（`code=unauthorized`）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Forbidden:
      description: 无权限（`code=forbidden`）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    NotFound:
      description: 不存在或不可见（`code=not_found`）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    Conflict:
      description: 状态冲突或唯一约束冲突（`code=conflict`）
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    TooManyRequests:
      description: 限流（`code=rate_limited`）
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
    ServiceUnavailable:
      description: 依赖不可用（`code=database_unavailable|orchestrator_unavailable|model_gateway_unavailable`）
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
  schemas:
    ErrorCode:
      type: string
      description: '稳定的**通用**错误分类（两层错误模型的第一层）：客户端按 `code` 做统一处理（重试/跳转/提示）。

        **领域原因**放第二层 `error.reason`（如 `ws_launch_timeout` / `gate_blocked`），

        其 wire 值 = 产品文档错误码（UPPER_SNAKE）的 lower_snake。

        '
      enum:
      - unauthorized
      - forbidden
      - not_found
      - validation_failed
      - conflict
      - idempotency_conflict
      - precondition_failed
      - quota_exceeded
      - rate_limited
      - unsupported_media_type
      - payload_too_large
      - internal_error
      - database_unavailable
      - orchestrator_unavailable
      - model_gateway_unavailable
      - upstream_error
    ErrorReason:
      type: string
      description: "领域原因（两层错误模型的第二层）：`PRD/JOURNEYS` 的大写产品码 → lower_snake。\n示例映射：`AUTH_SESSION_EXPIRED`→`auth_session_expired`、`AUTHZ_FORBIDDEN`→`authz_forbidden`、\n\
        `WS_LAUNCH_TIMEOUT`→`ws_launch_timeout`、`WS_IMAGE_PULL_FAILED`→`ws_image_pull_failed`、\n`WS_QUOTA_EXCEEDED`→`ws_quota_exceeded`、`MODEL_NOT_AUTHORIZED`→`model_not_authorized`、\n\
        `MODEL_BUDGET_EXCEEDED`→`model_budget_exceeded`、`EVAL_GATE_FAILED`/`GATE_BLOCKED`→`gate_blocked`、\n`SKILL_PERMISSION_DENIED`→`skill_permission_denied`、`SHARE_LINK_EXPIRED`→`share_link_expired`、\n\
        `MCP_HEALTH_DOWN`→`mcp_health_down`、`MCP_AUTH_REQUIRED`→`mcp_auth_required`、`APP_BUILD_FAILED`→`app_build_failed`。\n\
        \ v3（1.1.0）追加 MCP/协同/分享/数字人/工作流 reason（见 ARCH-V3 §23.4）。"
      enum:
      - auth_session_expired
      - authz_forbidden
      - workspace_not_ready
      - workspace_not_found
      - workspace_limit_reached
      - ws_quota_exceeded
      - ws_launch_timeout
      - ws_image_pull_failed
      - ws_storage_full
      - ws_storage_attach_failed
      - model_not_authorized
      - model_budget_exceeded
      - skill_permission_denied
      - gate_blocked
      - share_link_expired
      - mcp_health_down
      - mcp_auth_required
      - app_build_failed
      - config_stale
      - idp_unavailable
      - workspace_destroy_cooldown
      - ticket_reused
      - tenant_context_missing
      - ticket_invalid
      - tenant_mismatch
      - tool_not_allowed
      - version_conflict
      - result_too_large
      - upstream_timeout
      - upstream_error
      - circuit_open
      - server_not_found
      - tool_not_found
      - collab_base_moved
      - collab_patch_denied
      - collab_proposal_conflict
      - share_password_required
      - share_password_invalid
      - dh_session_active
      - dh_concurrency_exceeded
      - dh_gpu_budget_exceeded
      - dh_avatar_unavailable
      - dh_voice_unauthorized
      - dh_rtc_unavailable
      - dh_tts_unavailable
      - dh_lipsync_failed
      - dh_content_blocked
      - dh_embed_token_invalid
      - wf_dsl_invalid
      - wf_trigger_invalid
      - wf_run_not_found
      - wf_version_immutable
      - wf_concurrency_exceeded
      - wf_quota_exceeded
      - wf_node_failed
      - wf_human_task_expired
      - wf_script_denied
      - wf_compensation_failed
    Error:
      type: object
      required:
      - code
      - message
      - request_id
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        reason:
          allOf:
          - $ref: '#/components/schemas/ErrorReason'
          description: 领域原因（可选，业务错误建议必填）；与 `code` 组合表达"通用类 + 具体因"
        message:
          type: string
        details:
          type: object
          additionalProperties: true
          description: 结构化上下文（字段名按 `reason` 而定，如 `{"field":"name"}` / `{"failed_cases_top5":[...]}`）
        request_id:
          type: string
    ErrorEnvelope:
      type: object
      required:
      - error
      properties:
        error:
          $ref: '#/components/schemas/Error'
    Health:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        version:
          type: string
        checks:
          type: object
          additionalProperties:
            type: string
            enum:
            - ok
            - degraded
            - down
    Session:
      type: object
      required:
      - user_id
      - org_id
      - expires_at
      properties:
        user_id:
          type: string
          format: uuid
        org_id:
          type: string
          format: uuid
        expires_at:
          type: string
          format: date-time
        issued_at:
          type: string
          format: date-time
    Jwks:
      type: object
      required:
      - keys
      properties:
        keys:
          type: array
          items:
            type: object
            required:
            - kty
            - kid
            - alg
            - use
            properties:
              kty:
                type: string
                enum:
                - OKP
              crv:
                type: string
                enum:
                - Ed25519
              kid:
                type: string
              alg:
                type: string
                enum:
                - EdDSA
              use:
                type: string
                enum:
                - sig
              x:
                type: string
    Me:
      type: object
      required:
      - user
      - orgs
      - active_org
      properties:
        user:
          $ref: '#/components/schemas/User'
        orgs:
          type: array
          items:
            $ref: '#/components/schemas/OrgSummary'
        active_org:
          $ref: '#/components/schemas/OrgSummary'
        permissions:
          type: array
          items:
            type: string
          description: 计算后的权限点，如 `workspace.create`、`org.members.manage`
        entitlements:
          type: object
          properties:
            max_workspaces:
              type: integer
            default_model:
              type: string
            features:
              type: array
              items:
                type: string
    User:
      type: object
      required:
      - id
      - email
      - display_name
      - status
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        display_name:
          type: string
        avatar_url:
          type:
          - string
          - 'null'
          format: uri
        locale:
          type: string
          example: zh-CN
        status:
          type: string
          enum:
          - active
          - suspended
          - deactivated
        last_login_at:
          type:
          - string
          - 'null'
          format: date-time
        created_at:
          type: string
          format: date-time
    OrgSummary:
      type: object
      required:
      - id
      - slug
      - name
      - role
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
        role:
          $ref: '#/components/schemas/OrgRole'
    Org:
      type: object
      required:
      - id
      - slug
      - name
      - kind
      - role
      - member_count
      - created_at
      properties:
        id:
          type: string
          format: uuid
        slug:
          type: string
        name:
          type: string
