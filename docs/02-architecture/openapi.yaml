    post:
      tags:
      - workspaces
      operationId: createAccessTicket
      summary: 换取进入工作区的一次性票据
      description: '返回子域名 URL + 一次性 ticket（60s、jti 绑定 user+workspace）。前端把它作为 `url` 打开；

        `workspace-gateway` 校验后设置会话 Cookie 并 302 到 `/`（去掉 ticket，避免 Referer 泄露）。

        **`mode`**：`redirect`（默认，新标签页）或 `embed`（iframe；Q2 才正式支持）。

        '
      responses:
        '200':
          description: 票据（每次新 jti，一次性；不缓存、不参与 Idempotency-Key）
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTicket'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: 工作区不存在或不属于当前用户（**跨租户统一返回 404，防存在性探测**）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '409':
          description: 工作区未就绪（`state` 非 ready/idle）；见 `ErrorReason.workspace_not_ready`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
