    WorkspaceState:
      type: string
      description: '`provisioning` 创建中 → `starting` 启动中 → `ready` 可交互 → `idle` 无活动会话（仍可用）→

        `stopping` → `stopped` Pod=0（PVC 保留）→ `deleting` → `deleted`；任意态可进 `error`。

        **退出/断连绝不会进入 stopping/deleting。**

        '
      enum:
      - provisioning
      - starting
      - ready
      - idle
      - stopping
      - stopped
      - error
      - deleting
      - deleted
    WorkspaceError:
      type: object
      description: '工作区诊断错误。`code` **统一使用** `ErrorReason` 的 canonical 值（不再有独立枚举），

        便于前端按 reason 分支；CR 内部细分原因放 `details.cr_reason`

        （`scheduling_failed|start_timeout|unhealthy` 等仅作诊断展示）。

        '
      required:
      - code
      - message
      properties:
        code:
          $ref: '#/components/schemas/ErrorReason'
        message:
          type: string
        retryable:
          type: boolean
