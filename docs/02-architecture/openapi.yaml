  /api/v1/events:
    get:
      tags:
      - events
      operationId: subscribeEvents
      summary: 控制面事件流（SSE）
      description: '`Content-Type: text/event-stream`。事件 `id` 为单调序号，客户端断线后带 `Last-Event-ID` 头续传

        （服务端保留 5 分钟回放窗口，超出则发送 `resync` 事件要求全量拉取）。


        事件类型（`event:` 字段）：

        - `workspace.status_changed` — data: `{workspace_id, from, to, reason, at}`

        - `workspace.event` — data: `WorkspaceEvent`

        - `skill.installation.changed` — data: `{installation_id, skill_id, status}`

        - `eval.run.finished` — data: `{run_id, status, metrics}`

        - `app.deployment.changed` — data: `{app_id, deployment_id, status, url}`

        - `share.changed` — data: `{app_id, share_id, action}`

        - `usage.quota.warning` — data: `{org_id, scope, used_pct}`

        - `resync` — data: `{reason}`，客户端应重新拉取列表

        - `heartbeat` — 每 20s，防止中间层断开空闲连接


        **连续性语义**：只承诺"可重连的可见连续性"（5 分钟回放窗口 + `Last-Event-ID`；超出窗口发 `resync`）。

        **不保证**断线期间事件不丢失；客户端必须以列表接口 + `ETag` 做全量兜底。慢消费者会被主动断流（不阻塞其他连接）。

        '
      parameters:
      - name: types
        in: query
        description: 逗号分隔的事件类型过滤（默认全部）
        schema:
          type: string
      - name: Last-Event-ID
        in: header
        schema:
          type: string
      responses:
        '200':
          description: SSE 流
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-cache
            X-Accel-Buffering:
              schema:
                type: string
                example: 'no'
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
