      summary: 显式销毁工作区（二次确认 + 冷却期）
      description: '**不可撤销的意图**：请求成功后进入冷却期（默认 **5 分钟**，可配 5min–24h，`destroy_scheduled_at`），

        期间可用 `POST /workspaces/{id}/destroy/cancel` 取消；冷却结束才真正删除。删除前自动创建 PVC 快照：

        **PVC 保留 24h（快速恢复），之后仅保留快照 30 天（从快照重建）**。合规可配。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
