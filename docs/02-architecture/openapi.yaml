openapi: 3.1.0
info:
  title: OpenDream Cloud Platform API
  version: 1.1.0
  summary: 多租户 OpenDream Cloud 控制面 API（认证 / 组织 / 模型 / 工作区 / 技能 / 评测 / 应用 / 分享 / MCP / 用量 / 审计）
  description: "# 约定\n\n## 版本化\n所有端点位于 `/api/v1`。破坏性变更通过新前缀 `/api/v2` 提供；同一大版本内只做向后兼容的加法。\n`Sunset` 响应头用于标记将废弃端点（RFC 8594），至少提前\
    \ 180 天。\n\n## 认证\n两种方式（二选一）：\n- **浏览器会话**：`Cookie: __Host-oc_session=<opaque>`（由**控制面 auth-edge（唯一 OIDC RP）**在 OIDC 回调后设置：host-only、无\
    \ `Domain`、HttpOnly/Secure/SameSite=Lax）。\n- **平台 API Key**：`Authorization: Bearer ock_...`（用于 SDK/CI，见 `/api-keys`）。\n\
    \n## 错误\n所有非 2xx 响应使用统一信封：\n```json\n{\"error\":{\"code\":\"workspace_not_found\",\"message\":\"Workspace not found\"\
    ,\"details\":{\"workspace_id\":\"...\"},\"request_id\":\"01J...\"}}\n```\n`code` 是稳定的机器可读枚举（见 `ErrorCode`），客户端按 `code`\
    \ 分支，**不要**解析 `message`。\n每个响应都带 `X-Request-Id`，与 `error.request_id` 一致。\n\n## 分页\n游标分页：`?cursor=<opaque>&limit=<1..100>`（默认\
    \ 20）。响应 `{\"items\":[...],\"next_cursor\":\"...\"}`，\n`next_cursor` 为 `null` 表示结束。默认**不返回** `total`；需要总数时显式 `?include_total=true`（成本更高，仅管理页使用）。\n\
    \n## 幂等\n写操作（POST/PATCH/PUT）接受 `Idempotency-Key` 头（建议 UUIDv7）。相同 key + 相同请求体在 24h 内返回首次结果\n（重放时带 `Idempotency-Replayed:\
    \ true`）；相同 key + 不同请求体返回 `409 idempotency_conflict`。\n**工作区创建、应用发布、评测提交必须携带。**\n\n## 时间与金额\n时间统一 RFC 3339 UTC（`2026-11-04T02:00:00Z`）。金额为\
    \ USD 十进制字符串（`\"0.01230000\"`），避免浮点误差；\ntoken 计数为整数。\n\n## 权限\n组织角色：`owner` > `admin` > `member` > `viewer`。资源级覆盖：工作区\
    \ owner、应用分享 ACL、MCP 绑定。\n未认证 → `401 unauthorized`；已认证但无权限 → `403 forbidden`；资源不存在或不可见 → `404 not_found`（避免存在性探测）。\n\n\
    ## 契约状态：FROZEN（2026-11-04，G5 前冻结）\n本文件是 SDK/契约定稿源。冻结后变更流程：**先 ADR → 升 minor 版本（1.1.0）→ 更新 `docs/02-architecture/README.md\
    \ §5.1` changelog → 通知 qa/platform-backend/capability-centers**。\nG4 MVP 为实现子集（约 30 端点），G5 起实现全部公开端点。`x-p2-deferred` 列出\
    \ 8 个**明确 P2**（G5 不实现，不得在代码里发明路径）。\n\n\n    ## 版本 1.1.0（v3 增量，2026-11-08）\n    新增：MCP 生命周期（16 端点）、App 协同（10）、数字人（9）、工作流与人工任务（13）、ErrorReason\
    \ +35（总数 58；auth_session_expired v2 已存在）。\n    约束：只加不改；数据面 `/v1/{orgSlug}/{serverSlug}` 与 `/internal/*` 不在本契约内。"
  x-contract-status: frozen@1.1.0
  x-frozen-at: '2026-11-08'
  x-frozen-scope: G5（四中心）公开 API 冻结；G4 MVP 为子集
  x-p2-deferred:
  - GET /api/v1/apps/{appId}/certificates
  - GET /api/v1/apps/{appId}/metrics
  - GET /api/v1/apps/{appId}/permissions
  - GET /api/v1/apps/by-slug/{slug}
  - GET /api/v1/mcp-servers/{serverId}/versions
  - POST /api/v1/skill-installations/{installationId}/rollback
  - POST /api/v1/skills/{skillId}/block
  - GET /api/v1/skills/{skillId}/reviews
  contact:
    name: OpenDream Cloud Team
  license:
    name: Proprietary
  x-v2-lock: openapi.v2.lock.json (96 paths / 131 ops)
  x-v3-notes: 1.1.0 只加不改：v2 全部 path/method/operationId 保留；未新增 required 字段；枚举仅追加。数据面 MCP endpoint /v1/{orgSlug}/{serverSlug}
    不在本文件。
  x-freeze-note: 1.1.0 MVP 对齐：平铺 App/单数 tool-policy 标 x-mvp-alias；collab-sessions 标 x-v3-target；enum 只加不改。
servers:
- url: https://api.opencode.cloud
  description: 生产
- url: https://api.staging.opencode.cloud
  description: 预发
- url: http://localhost:3001
  description: 本地开发
tags:
- name: auth
  description: 身份与会话
- name: orgs
  description: 组织、成员、团队
- name: api-keys
  description: 平台 API Key
- name: workspaces
  description: 云工作区生命周期与访问
- name: events
  description: 控制面事件流（SSE）
- name: models
  description: 模型中心（供应商/模型/策略）
- name: skills
  description: Skill 中心
- name: evals
  description: 评测中心
- name: apps
  description: 应用中心（构建/部署/回滚/日志）
- name: shares
  description: 应用分享 ACL
- name: mcp
  description: MCP 中心（目录/绑定/健康）
- name: usage
  description: 用量与配额
- name: audit
  description: 审计日志
- name: mcp-lifecycle
  description: MCP 生命周期（v3：版本/渠道/策略/审计）
- name: collab
  description: 应用协同（v3：会话/提案/审批）
- name: digital-human
  description: 数字人（v3）
- name: workflow
  description: 工作流与人工任务（v3）
security:
- sessionCookie: []
- bearerAuth: []
paths:
  /api/v1/health:
    get:
      tags:
      - auth
      operationId: getHealth
      summary: 健康检查（免认证）
      security: []
      responses:
        '200':
          description: 服务健康
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/auth/login:
    get:
      tags:
      - auth
      operationId: beginLogin
      summary: 发起 OIDC 登录（302 到 IdP）
      security: []
      parameters:
      - name: redirect_uri
        in: query
        schema:
          type: string
          format: uri
        description: 登录后回跳地址（必须命中白名单）
      - name: prompt
        in: query
        schema:
          type: string
          enum:
          - none
          - login
          - consent
        description: 透传给 IdP 的 prompt（`login` 用于强制重新认证）
      responses:
        '302':
          description: 重定向到 IdP authorize 端点
          headers:
            Location:
              schema:
                type: string
                format: uri
        '400':
          $ref: '#/components/responses/BadRequest'
  /api/v1/auth/callback:
    get:
      tags:
      - auth
      operationId: handleOidcCallback
      summary: OIDC 回调（控制面 auth-edge 处理；浏览器经 302 往返，非直接调用）
      description: '控制面是**唯一 OIDC RP**：本端点校验 `state`、用 `code_verifier` 交换 token、校验 `id_token`

        （`iss/aud/exp/nonce/azp`，拒绝 `alg=none|HS256`），随后建立 Redis 会话并设置

        `__Host-oc_session`（host-only，无 Domain），最后 302 回 `next`。

        CLI/SDK 使用 `POST /api/v1/auth/device`（设备码）走同一会话存储。

        '
      security: []
      parameters:
      - name: code
        in: query
        required: true
        schema:
          type: string
      - name: state
        in: query
        required: true
        schema:
          type: string
      responses:
        '302':
          description: 建立会话并重定向
          headers:
            Location:
              schema:
                type: string
                format: uri
            Set-Cookie:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      summary: 注销当前会话
      responses:
        '204':
          description: 已注销（清除 Cookie，吊销 refresh token）
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      operationId: refreshSession
      summary: 续期会话
      responses:
        '200':
          description: 新会话
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Session'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/csrf:
    get:
      tags:
      - auth
      operationId: getCsrfToken
      summary: 读取当前会话的 CSRF Token（控制台/浏览器用）
      description: '浏览器会话的写操作必须携带 `X-CSRF-Token`，其值与本接口返回的 `csrf_token`（同 `oc_csrf` Cookie）一致。

        Token 仅在已建立会话后可用；未登录返回 401。API Key 调用不需要 CSRF。

        '
      responses:
        '200':
          description: 当前 CSRF Token
          content:
            application/json:
              schema:
                type: object
                required:
                - csrf_token
                properties:
                  csrf_token:
                    type: string
                    minLength: 16
        '401':
          $ref: '#/components/responses/Unauthorized'
  /.well-known/workspace-jwks.json:
    get:
      tags:
      - auth
      - workspaces
      operationId: getWorkspaceJwks
      summary: 工作区访问票据的 JWKS 公钥（供 workspace-gateway 本地验签）
      security: []
      responses:
        '200':
          description: JWKS
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Jwks'
  /api/v1/me:
    get:
      tags:
      - auth
      operationId: getMe
      summary: 当前用户、组织与权限
      responses:
        '200':
          description: 当前身份
          headers:
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Me'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/orgs:
    get:
      tags:
      - orgs
      operationId: listOrgs
      summary: 我加入的组织
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 组织列表
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Org'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - orgs
      operationId: createOrg
      summary: 创建组织
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateOrgRequest'
      responses:
        '201':
          description: 已创建
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/orgs/{orgId}:
    parameters:
    - $ref: '#/components/parameters/OrgId'
    get:
      tags:
      - orgs
      operationId: getOrg
      summary: 组织详情
      responses:
        '200':
          description: 组织
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - orgs
      operationId: updateOrg
      summary: 更新组织（admin+）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateOrgRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Org'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/orgs/{orgId}/members:
    parameters:
    - $ref: '#/components/parameters/OrgId'
    get:
      tags:
      - orgs
      operationId: listMembers
      summary: 成员列表
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: 成员分页
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Membership'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - orgs
      operationId: inviteMember
      summary: 邀请成员（admin+）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InviteMemberRequest'
      responses:
        '201':
          description: 已邀请
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
  /api/v1/orgs/{orgId}/members/{memberId}:
    parameters:
    - $ref: '#/components/parameters/OrgId'
    - name: memberId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    patch:
      tags:
      - orgs
      operationId: updateMember
      summary: 修改角色/状态（admin+）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Membership'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - orgs
      operationId: removeMember
      summary: 移除成员（admin+）
      responses:
        '204':
          description: 已移除
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/api-keys:
    get:
      tags:
      - api-keys
      operationId: listApiKeys
      summary: 我的 API Key（不含明文与哈希）
      responses:
        '200':
          description: Key 列表
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApiKey'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - api-keys
      operationId: createApiKey
      summary: 创建 API Key（明文仅本次返回）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: 已创建（`plaintext` 只在此响应出现一次）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/api-keys/{keyId}:
    parameters:
    - name: keyId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    delete:
      tags:
      - api-keys
      operationId: revokeApiKey
      summary: 吊销 API Key（≤5s 生效）
      responses:
        '204':
          description: 已吊销
        '404':
          $ref: '#/components/responses/NotFound'
    post:
      tags:
      - api-keys
      operationId: rotateApiKey
      summary: 轮换 API Key（旧 Key 24h 后失效）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 新 Key（`plaintext` 只出现一次）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyCreated'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workspaces:
    get:
      tags:
      - workspaces
      operationId: listWorkspaces
      summary: 工作区列表（仅当前用户可见）
      parameters:
      - $ref: '#/components/parameters/Cursor'
      - $ref: '#/components/parameters/Limit'
      - name: state
        in: query
        description: 按状态过滤（多值逗号分隔）
        schema:
          type: string
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: 工作区分页
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
            X-Request-Id:
              $ref: '#/components/headers/RequestId'
          content:
            application/json:
              schema:
                type: object
                required:
                - items
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Workspace'
                  next_cursor:
                    type:
                    - string
                    - 'null'
        '304':
          description: 未变更（配合 If-None-Match）
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags:
      - workspaces
      operationId: createWorkspace
      summary: 创建工作区（幂等；默认每用户 1 个）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWorkspaceRequest'
      responses:
        '202':
          description: 已受理，进入 `provisioning`（通过 SSE 跟踪进度）
          headers:
            Location:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/workspaces/me:
    get:
      tags:
      - workspaces
      operationId: getMyWorkspace
      summary: 当前用户的主工作区（不存在返回 404）
      responses:
        '200':
          description: 工作区
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workspaces/me/ensure:
    post:
      tags:
      - workspaces
      operationId: ensureMyWorkspace
      summary: 确保我的工作区存在并可用（登录后调用；幂等）
      description: '语义：不存在 → 创建；`stopped` → 启动；`ready/idle` → 直接返回；`provisioning/starting` → 返回 202 当前态；

        `error` → 返回 200 并带 `error` 字段（由前端决定重试）。**绝不**因调用而销毁或重置数据。

        '
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
        '200':
          description: 已就绪
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '202':
          description: 正在创建/启动
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
  /api/v1/workspaces/{workspaceId}:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    get:
      tags:
      - workspaces
      operationId: getWorkspace
      summary: 工作区详情
      responses:
        '200':
          description: 工作区
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - workspaces
      operationId: updateWorkspace
      summary: 修改展示名/默认模型（不影响运行中会话）
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateWorkspaceRequest'
      responses:
        '200':
          description: 已更新
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workspace'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/workspaces/{workspaceId}/start:
    parameters:
    - $ref: '#/components/parameters/WorkspaceId'
    post:
      tags:
      - workspaces
      operationId: startWorkspace
      summary: 启动（从 stopped/idle 唤醒）
      parameters:
      - $ref: '#/components/parameters/IdempotencyKey'
      responses:
