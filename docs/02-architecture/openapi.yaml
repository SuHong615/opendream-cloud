      responses:
        '200':
          description: 票据（每次新 jti，一次性；不缓存、不参与 Idempotency-Key）
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccessTicket'
