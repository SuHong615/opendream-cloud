  /api/v1/usage:
    get:
      tags:
      - usage
      operationId: queryUsage
      summary: 用量查询（按维度聚合）
      description: '数据源为 LiteLLM spend log 的聚合（权威）。`from`/`to` 默认最近 7 天，最大跨度 90 天。

        `bucket` 为时间桶（`group_by=day|hour` 时必填）；不传 `group_by` 时返回 `summary` 与按用户分组的默认视图。

        '
      parameters:
      - name: from
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        schema:
          type: string
          format: date-time
      - name: group_by
        in: query
        schema:
          type: string
          enum:
          - user
          - workspace
          - model
          - day
          - hour
          - none
        default: none
      - name: workspace_id
        in: query
        schema:
          type: string
          format: uuid
      - name: user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: model_id
        in: query
        schema:
          type: string
          format: uuid
      - name: include_total
        in: query
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: 用量
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsageResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'
