      operationId: createAppAccessTicket
      summary: 换取进入应用的一次性票据（控制面为唯一 RP，故应用入口同工作区走 ticket）
      description: '`aud=app:<id>`、60s、一次性；`app-gateway` 验签后设置 `__Host-oc_app`（host-only）并 302。

        返回前会校验 SSO 会话 + ACL（scope/role/expires_at）；无权返回 403，无权且不可见返回 404。

