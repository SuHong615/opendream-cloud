name: ci

on:
  push:
    branches: [main, dev]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache-dependency-path: services/workspace-operator/go.sum

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bun run typecheck

      - name: License / author check
        run: bun run check:license

      - name: Unit / contract tests
        run: bun run test

      - name: Control-plane coverage
        working-directory: apps/control-plane
        run: bun test --coverage

      - name: Four capability centers
        run: bun test services/skill-center services/eval-center services/app-center services/mcp-hub

      - name: Console build
        run: bun run --cwd apps/console build

      - name: Operator build + tests
        working-directory: services/workspace-operator
        run: |
          go build ./...
          go test ./...

      - name: Manifest validation
        run: bun run validate:manifests

      - name: OpenAPI parse
        run: |
          python3 - <<'PY'
          import yaml
          with open("docs/02-architecture/openapi.yaml", encoding="utf-8") as fh:
              doc = yaml.safe_load(fh)
          assert doc["openapi"] == "3.1.0"
          assert len(doc["paths"]) >= 90
          print("openapi", doc["info"]["version"], "paths", len(doc["paths"]))
          PY
