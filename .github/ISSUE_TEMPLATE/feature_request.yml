name: Feature request
description: Suggest an idea or enhancement
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: 建议方案
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 备选方案/影响范围
  - type: checkboxes
    id: scope
    attributes:
      label: 是否涉及
      options:
        - label: 新增第三方依赖（需登记许可证）
        - label: 前端 UI 变更（需截图）
        - label: 契约/API 变更
